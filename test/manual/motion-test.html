<!doctype html>
<html><head><meta charset="utf-8"><title>patch-mark motion</title>
<style>
 body{font-family:system-ui;margin:0;padding:3rem;background:#f6f8fb;color:#111}
 .card{max-width:44rem;margin:0 auto 1.25rem;background:#fff;border-radius:14px;padding:1.75rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
 h1{margin:0 0 .5rem;font-size:1.6rem} p{color:#4b5563;line-height:1.65}
 .btn{background:#0058d0;color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font-size:.95rem;cursor:pointer}
 .row{display:flex;gap:.75rem;margin-top:1rem}
</style></head>
<body>
 <div class="card"><h1>Motion smoke test</h1>
  <p>点右侧启动按钮，观察三处：按钮 hover 的抬升与回弹、面板的 rise 入场、批注列表的逐条 stagger。</p>
  <div class="row"><button class="btn">Primary</button><button class="btn" style="background:#374151">Secondary</button></div>
 </div>
 <div class="card"><h1>Second block</h1><p>用来测试点选不同元素时高亮框的跟随表现。</p></div>
 <script type="module" src="/dist/patch-mark.js"></script>
 <patch-mark visible></patch-mark>
</body></html>
